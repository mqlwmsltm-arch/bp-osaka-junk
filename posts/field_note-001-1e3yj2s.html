      <p>우리가 작성해야 할 글의 주제는 "Cloudflare의 cache reserve가 특정 엣지 로케이션에서 최대 47분까지 무효화가 지연되는 현상"입니다. 맥락은 "클라우드/인프라 엣지케이스 / Lightsail CPU 크레딧"이고, 금지된 지식은 AWS 서비스 개요, 클라우드 비용 절감 일반 팁, 서버리스 아키텍처 장단점입니다. 또한 관점을 "온콜 엔지니어"의 시점에서 "새벽 3시에 울린 페이저의 진짜 원인이 특정 리전 DNS 장애였던 썰"이라는 갈등을 중심으로 서사를 전개해야 합니다.</p>
